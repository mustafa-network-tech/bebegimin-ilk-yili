# Supabase CLI configuration for LOCAL development (`supabase start`).
# Remote projects are configured in the dashboard (see README).
project_id = "bebegimin-ilk-yili"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = true

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "500MiB"

[auth]
enabled = true
site_url = "bebegimin://login-callback"
additional_redirect_urls = ["bebegimin://login-callback", "http://127.0.0.1:3000"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
minimum_password_length = 8
password_requirements = "letters_digits"

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true
max_frequency = "1m0s"

[auth.rate_limit]
email_sent = 4
sign_in_sign_ups = 30
token_verifications = 30

[edge_runtime]
enabled = true
policy = "per_worker"

[functions.privacy-actions]
verify_jwt = true

# Called by a Database Webhook / pg_net with a shared secret, not by users.
[functions.send-push]
verify_jwt = false

[functions.storage-cleanup]
verify_jwt = false
