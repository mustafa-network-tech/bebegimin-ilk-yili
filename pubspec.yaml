name: bebegimin_ilk_yili
description: "Bebeğimin İlk Yılı — özel aile ve bebek anı arşivi, İlk Yılım kitabı."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.4

dependencies:
  app_links: ^7.2.1
  cached_network_image: ^4.0.2
  collection: ^1.19.1
  connectivity_plus: ^7.3.1
  crypto: ^3.0.7
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  flutter:
    sdk: flutter
  flutter_image_compress: ^2.5.1
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.1
  http: ^1.6.0
  image_picker: ^1.2.3
  in_app_purchase: ^3.3.1
  in_app_purchase_android: ^0.5.3
  intl: ^0.20.3
  path_provider: ^2.1.6
  pdf: ^3.13.1
  printing: ^5.15.1
  share_plus: ^13.3.0
  shared_preferences: ^2.5.5
  supabase_flutter: ^2.17.2
  table_calendar: ^3.2.1
  uuid: ^4.6.0
  video_player: ^2.14.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Regular.ttf
        - asset: assets/fonts/Nunito-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Nunito-Bold.ttf
          weight: 700
        - asset: assets/fonts/Nunito-ExtraBold.ttf
          weight: 800
    - family: Lora
      fonts:
        - asset: assets/fonts/Lora-Regular.ttf
        - asset: assets/fonts/Lora-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Lora-Italic.ttf
          style: italic
